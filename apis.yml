name: Datalogue
description: >-
  Datalogue was a self-service data integration and preparation startup founded
  in 2015 that used machine learning to automatically classify, transform, and
  standardize data from disparate sources for analytics teams. Backed by
  Bloomberg Beta, the company was acquired by Nike in February 2019 and its
  standalone product was discontinued; the datalogue.io domain now serves an
  unrelated blog. This profile is retained for the API Evangelist network as a
  historical/portfolio record. The only surviving first-party developer
  artifacts are the company's public GitHub organization and an unmaintained
  Python SDK ("datalogue") still published on PyPI.
